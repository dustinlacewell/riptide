name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "packs/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11, as the lock files were written with; npm 10 reads their
          # optional platform packages as out of sync.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The site imports the app (../src), which resolves packages from the
      # repo root, so both installs are needed. The root lock is written on
      # Windows, where npm leaves out rolldown's Linux-only wasm packages
      # (@emnapi/*); `npm ci` then calls it out of sync, so install instead.
      - run: npm install --no-audit --no-fund
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
